<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dickies PDP Preview</title>

    }

    body {
      margin: 0;

      max-width: 960px;
      margin: 0 auto;
    }

    img {
      display: block;
      width: 100%;
      height: auto;

    video {
      display: block;
      width: 100%;

    }

    @media (max-width: 767px) {

      }

      .inline-video {
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <img src="3.jpg" alt="">

      </video>
    </div>
    <img src="5.jpg" alt="">
    <img src="6.jpg" alt="">
    <img src="7.jpg" alt="">
    <video class="inline-video" autoplay loop muted playsinline>
      <source src="2.mp4" type="video/mp4">
    </video>
    <img src="8.jpg" alt="">
    <img src="9.jpg" alt="">

</body>
</html>
