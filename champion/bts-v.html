<script>
(function () {
	function initBtsvPage(root, retryCount) {
		if (root.dataset.btsvInitialized === 'true') {
			return;
		}

		if (typeof Swiper === 'undefined') {
			if ((retryCount || 0) < 20) {
				setTimeout(function () {
					initBtsvPage(root, (retryCount || 0) + 1);
				}, 100);
			}
			return;
		}

		root.dataset.btsvInitialized = 'true';
		var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
		var thumbsElement = root.querySelector('.btsv-gallery__thumbs');
		var mainElement = root.querySelector('.btsv-gallery__main');

		var thumbsSwiper = new Swiper(thumbsElement, {
			slidesPerView: 4.5,
			spaceBetween: 8,
			watchSlidesProgress: true,
			breakpoints: {
				769: {
					slidesPerView: 8,
					spaceBetween: 16
				}
			}
		});

		new Swiper(mainElement, {
			loop: true,
			speed: reduceMotion ? 0 : 700,
			autoplay: reduceMotion ? false : {
				delay: 3500,
				disableOnInteraction: false
			},
			thumbs: {
				swiper: thumbsSwiper
			}
		});

		function syncHeroVideo() {
			var isMobile = window.matchMedia('(max-width: 768px)').matches;
			var videos = root.querySelectorAll('[data-btsv-video]');

			videos.forEach(function (video) {
				var shouldPlay = video.dataset.btsvVideo === (isMobile ? 'mobile' : 'desktop');

				if (shouldPlay && !reduceMotion) {
					var playPromise = video.play();
					if (playPromise && typeof playPromise.catch === 'function') {
						playPromise.catch(function () {});
					}
				} else {
					video.pause();
				}
			});
		}

		syncHeroVideo();
		window.addEventListener('resize', syncHeroVideo);
	}

	function initBtsvPages() {
		document.querySelectorAll('.btsv-event').forEach(function (root) {
			initBtsvPage(root, 0);
		});
	}

	if (document.readyState === 'loading') {
