if(d.mu.length||d.cm.length){h+=`<div class="pf ${d.cm.length?'pf2':'pf1'}">`;if(d.mu.length)h+=`<div class="mu"><div class="pn">무신사</div>${d.mu.map(t=>`<div class="pi">${esc(t)}</div>`).join('')}</div>`;if(d.cm.length)h+=`<div class="cm29"><div class="pn">29CM</div>${d.cm.map(t=>`<div class="pi">${esc(t)}</div>`).join('')}</div>`;h+=`</div>`}
const pb=Object.keys(d.br);const cbs=Object.keys(CB).filter(b=>CB[b][d.m]);const all=[...new Set([...pb,...cbs])];all.sort((a,b)=>{const ai=BO.indexOf(a),bi=BO.indexOf(b);return(ai<0?99:ai)-(bi<0?99:bi)});
if(all.length){all.forEach(b=>{const c=BC[b]||['#444','#f5f5f5'];const items=d.br[b]||[];const cols=(CB[b]&&CB[b][d.m])||[];
h+=`<div class="bb" style="background:${c[1]};border-color:${c[0]}"><div class="bn" style="color:${c[0]}">${esc(b)}`;
if(items.length)h+=` <span class="bc">${items.length}건</span>`;
if(cols.length)h+=` <span class="ct" style="background:${c[0]};color:${c[1]}">콜라보 ${cols.length}</span>`;
h+=`</div>`;
if(cols.length){h+=`<div class="cw">`;cols.forEach(cb=>{const t=cb.includes('TBD');h+=`<span class="cp" style="border-color:${c[0]}44;background:${c[0]}11;color:${c[0]};opacity:${t?.6:1}">${esc(cb)}</span>`});h+=`</div>`}
items.forEach(it=>{const isO=it.startsWith('[오프]');const tx=isO?it.slice(4).trim():it;h+=`<div class="bi${isO?' of':''}" style="color:${c[0]}">${isO?'<span class="ot" style="background:'+c[0]+'22">오프</span>':''}${esc(tx)}</div>`});
h+=`</div>`})}else h+=`<div class="empty">상세 프로모션 미입력</div>`;
document.getElementById('ct').innerHTML=h;window.scrollTo({top:0,behavior:'smooth'})}
window.sel=function(m){cur=m;renderTabs();render()};renderTabs();render();
</script></body></html>
